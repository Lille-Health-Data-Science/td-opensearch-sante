# OpenSearch 3.8.0 et Dashboards pour le TD de la séance 3.
# Sécurité désactivée : acceptable sur un portable de TP, jamais avec des données réelles.
# Lancer :  docker compose up -d        Arrêter :  docker compose down
services:
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ports: ["9200:9200"]
    restart: unless-stopped
  dashboards:
    image: opensearchproject/opensearch-dashboards:3.8.0
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports: ["5601:5601"]
    depends_on: [opensearch]
    restart: unless-stopped
